name: ARI
description: 'ARI (shopARI) is a New York City based artificial intelligence company
  building a personal shopping and styling assistant for fashion. The product is positioned
  as an AI stylist that produces custom style recommendations across a curated marketplace
  of both major and independent brands, interpreting the intent and sentiment behind
  a shopper request rather than matching product tags alone. The company was founded
  by Lior Cole and has raised pre-seed capital from investors including Bloomberg Beta,
  1517 Fund, Correlation Ventures, Daybreak Ventures and Z Fellows. As of this enrichment
  pass ARI operates as a consumer application and publishes no public developer API,
  documentation portal, SDKs or machine-readable specification; the shopari.com domain
  is registered and carries mail records but resolves no web address record.'
